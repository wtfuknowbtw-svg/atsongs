services:
  - type: web
    name: stitch-music-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard → paste your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: B2_KEY_ID
        sync: false   # Set in Render dashboard → Backblaze B2 application key ID
      - key: B2_APP_KEY
        sync: false   # Set in Render dashboard → Backblaze B2 application key
      - key: B2_ENDPOINT
        sync: false   # e.g. https://s3.us-west-004.backblazeb2.com (set in Render dashboard)
      - key: B2_BUCKET
        sync: false   # Set in Render dashboard → B2 bucket name
      # Legacy (optional) — Cloudinary storage is replaced by Backblaze B2;
      # leave unset unless you still need the old Cloudinary path.
      # - key: CLOUDINARY_CLOUD_NAME
      # - key: CLOUDINARY_API_KEY
      # - key: CLOUDINARY_API_SECRET
